<div class="card graphic-design overflow-hidden">
  <div class="card-header card-no-border pb-0">
    <div class="header-top">
      <div class="d-flex align-items-center gap-2">
        <div class="flex-shrink-0">
          <div class="icon">
            <img class="img-fluid" src="{{ data()?.img }}" alt="chair" />
          </div>
        </div>
        <div class="flex-grow-1">
          <h5>{{ data()?.title }}</h5>
          <p class="mb-0">{{ data()?.name }}</p>
        </div>
      </div>
      <div class="dropdown icon-dropdown" (clickOutside)="clickOutside()">
        <button class="btn" id="userdropdown1" type="button" (click)="open()">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
        <div class="dropdown-menu dropdown-menu-end" [class.show]="isopen">
          <a class="dropdown-item" href="javascript:void(0)">Weekly</a>
          <a class="dropdown-item" href="javascript:void(0)">Monthly</a>
          <a class="dropdown-item" href="javascript:void(0)">Yearly</a>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body p-0">
    <ul>
      <li>
        <i class="iconly-Document icli me-1"></i>
        <h5>{{ data()?.lessons }} Lessons</h5>
      </li>
      <li>
        <i class="iconly-Time-Square icli me-1"></i>
        <h5>{{ data()?.hours }} Hours</h5>
      </li>
      <li>
        <i class="iconly-User3 icli me-1"></i>
        <h5>{{ data()?.students }} Students</h5>
      </li>
      <li>
        <i class="iconly-Star icli me-1"></i>
        <h5>{{ data()?.rating }}</h5>
      </li>
    </ul>
    <div class="crypto-dashborad-chart">
      <div class="bitcoin-chart" id="bitcoin-chart">
        <apx-chart
          [series]="$safeNavigationMigration(data()?.series)!"
          [annotations]="$safeNavigationMigration(data()?.annotations)!"
          [chart]="$safeNavigationMigration(data()?.chart)!"
          [dataLabels]="$safeNavigationMigration(data()?.dataLabels)!"
          [stroke]="$safeNavigationMigration(data()?.stroke)!"
          [tooltip]="$safeNavigationMigration(data()?.tooltip)!"
          [xaxis]="$safeNavigationMigration(data()?.xaxis)!"
          [yaxis]="$safeNavigationMigration(data()?.yaxis)!"
          [colors]="$safeNavigationMigration(data()?.colors)!"
          [grid]="$safeNavigationMigration(data()?.grid)!"
          [legend]="$safeNavigationMigration(data()?.legend)!"
          [fill]="$safeNavigationMigration(data()?.fill)!"
        />
      </div>
    </div>
  </div>
</div>
